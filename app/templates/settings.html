{% extends "base.html" %}
{% block title %}{{ t('settings.title') }}{% endblock %}
{% block content %}

<form class="card" method="post" action="/settings">
  <h2>{{ t('settings.brake') }}</h2>
  <div class="grid">
    <label>{{ t('settings.brake_replace_absolute') }}
      <input type="number" min="0" name="brake_replace_absolute" value="{{ values.brake_replace_absolute }}"></label>
    <label>{{ t('settings.brake_replace_percent') }}
      <input type="number" min="0" step="0.01" name="brake_replace_percent" value="{{ values.brake_replace_percent }}"></label>
    <label>{{ t('settings.brake_delete_absolute') }}
      <input type="number" min="0" name="brake_delete_absolute" value="{{ values.brake_delete_absolute }}"></label>
    <label>{{ t('settings.brake_delete_percent') }}
      <input type="number" min="0" step="0.01" name="brake_delete_percent" value="{{ values.brake_delete_percent }}"></label>
    <label>{{ t('settings.slave_free_space_gb') }}
      <input type="number" min="0" name="slave_free_space_gb" value="{{ values.slave_free_space_gb }}"></label>
  </div>

  <h2>{{ t('settings.behaviour') }}</h2>
  <div class="grid">
    <label class="check">
      <input type="checkbox" name="detect_renames" value="1" {% if values.detect_renames not in ('0', '') %}checked{% endif %}>
      {{ t('settings.detect_renames') }}</label>
    <label class="check">
      <input type="checkbox" name="verify_after_copy" value="1" {% if values.verify_after_copy not in ('0', '') %}checked{% endif %}>
      {{ t('settings.verify_after_copy') }}</label>
    <label>{{ t('settings.assignment_depth') }}
      <input type="number" min="1" max="4" name="assignment_depth" value="{{ values.assignment_depth }}"></label>
  </div>

  <div class="actions"><button class="primary">{{ t('common.save') }}</button></div>
</form>
{% endblock %}
